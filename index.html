<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Market Pulse | Terminal de Inteligencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a0c;
            --card-bg: #121318;
            --card-border: #1f222c;
            --accent-blue: #3b82f6;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --badge-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 20px 16px 60px 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Buscador Global */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        /* Grid de Tarjetas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .ref {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 6px;
        }

        .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Luxury Market <span>Pulse</span></div>
    </header>

    <main>
        <h1 class="section-title">Laboratorio de Referencias (En Vivo)</h1>
        <p class="section-subtitle">Estado actual del mercado secundario sincronizado con Supabase</p>

        <!-- Barra de Búsqueda Global -->
        <input type="text" id="busqueda-input" class="search-box" placeholder="Buscar por marca, modelo o referencia (ej. Rolex, 126610LN)..." onkeyup="filtrarRelojes()">

        <div id="grid-laboratorio" class="grid">
            <p style="color: var(--text-muted);">Cargando datos desde Supabase...</p>
        </div>
    </main>

    <!-- Supabase SDK & JavaScript de Control -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://sokjtqnrqjzqkopoqpze.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mUFpmAp3SEDwWxK-EZlA9A_xisWGyZS';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let listaRelojesGlobal = [];

        async function cargarLaboratorio() {
            const contenedor = document.getElementById('grid-laboratorio');
            if (!contenedor) return;

            try {
                const { data, error } = await supabaseClient
                    .from('relojes_laboratorio')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p style="color: var(--text-muted);">No hay referencias registradas.</p>';
                    return;
                }

                listaRelojesGlobal = data;
                renderizarRelojes(listaRelojesGlobal);

            } catch (error) {
                console.error('Error Supabase:', error);
                contenedor.innerHTML = '<p style="color: #ff4444;">Error al conectar con la base de datos</p>';
            }
        }

        function renderizarRelojes(relojes) {
            const contenedor = document.getElementById('grid-laboratorio');
            if (!relojes || relojes.length === 0) {
                contenedor.innerHTML = '<p style="color: var(--text-muted);">No se encontraron coincidencias.</p>';
                return;
            }

            contenedor.innerHTML = relojes.map(reloj => `
                <div class="card">
                    <span class="badge">${reloj.liquidez || 'Alta demanda'}</span>
                    <h3>${reloj.marca || 'Reloj'} ${reloj.modelo || ''}</h3>
                <div class="price">${reloj.precio ? Number(reloj.precio).toLocaleString('es-ES') + ' €' : (reloj.precio_medio ? Number(reloj.precio_medio).toLocaleString('es-ES') + ' €' : 'Consultar')}</div>
<div class="meta">${reloj.origen || reloj.dias_mercado || reloj.meta || 'Mercado Global'}</div>
                    <div class="meta">${reloj.meta || 'Mercado Global'}</div>
                </div>
            `).join('');
        }

        function filtrarRelojes() {
            const busqueda = document.getElementById('busqueda-input').value.toLowerCase().trim();
            if (!busqueda) {
                renderizarRelojes(listaRelojesGlobal);
                return;
            }

            const filtrados = listaRelojesGlobal.filter(reloj => {
                const marca = (reloj.marca || '').toLowerCase();
                const modelo = (reloj.modelo || '').toLowerCase();
                const ref = (reloj.referencia || '').toLowerCase();
                const meta = (reloj.meta || '').toLowerCase();
                return marca.includes(busqueda) || modelo.includes(busqueda) || ref.includes(busqueda) || meta.includes(busqueda);
            });

            renderizarRelojes(filtrados);
        }

        document.addEventListener('DOMContentLoaded', cargarLaboratorio);
        cargarLaboratorio();
    </script>
</body>
</html>
