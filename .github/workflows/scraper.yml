name: Automatizacion Luxury Market Scraper

on:
  schedule:
    # Se ejecuta de forma automática dos veces al día a horas aleatorias/distribuidas
    - cron: '17 4 * * *'
    - cron: '42 16 * * *'
  workflow_dispatch: # Permite pulsar un botón desde el móvil para ejecutarlo cuando quieras

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python_version: '3.10'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests

      - name: Ejecutar Rastreador
        run: python scraper.py
